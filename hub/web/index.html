<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMI Excavator hub</title>
  <link rel="stylesheet" href="/web/theme.css">
  <link rel="stylesheet" href="/web/shell.css">
</head>
<body>
  <aside id="side">
    <a class="brand" href="/" data-nav><span class="ui-mark" aria-hidden="true"></span>UMI Excavator</a>
    <nav id="nav"></nav>
  </aside>
  <main>
    <section id="home">
      <header class="ui-header"><h1 class="ui-title">All interfaces <span class="ui-sub">one hub, one page</span></h1></header>
      <div id="home-body"><div id="cards"></div></div>
    </section>
    <section id="app" hidden>
      <header id="bar" class="ui-header">
        <span class="dot" id="a-dot"></span>
        <h2 id="a-name" class="ui-title"></h2>
        <span class="ui-muted" id="a-status"></span>
        <div class="ui-header-end">
          <button id="a-start" class="btn-primary">Start</button>
          <button id="a-stop">Stop</button>
          <button id="a-restart">Restart</button>
          <button id="a-settings-btn" class="btn-quiet" aria-pressed="false">Settings</button>
        </div>
      </header>
      <div id="a-settings" hidden>
        <label>Options (JSON) <textarea id="a-options" spellcheck="false" rows="4"></textarea></label>
        <button id="a-save">Save</button>
        <pre id="a-trace" class="ui-log" hidden></pre>
      </div>
      <div id="views"></div>
      <div id="a-placeholder" hidden></div>
    </section>
  </main>
  <script type="module" src="/web/shell.js"></script>
</body>
</html>
